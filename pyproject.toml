[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.legacy:build"

[project]
name = "llm-judge-diversity"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.26",
    "datasets>=2.16",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]
